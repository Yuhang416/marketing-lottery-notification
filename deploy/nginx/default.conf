# 轮询转发到两个应用实例。登录用 JWT，没有本地 Session，不需要会话保持。
upstream lottery {
    server app-a:8080;
    server app-b:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://lottery;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
