spring.application.name=lottery-system
logging.config=classpath:logback-spring.xml

# MySQL：本机需创建 lottery_system 数据库，并设置 MYSQL_PASSWORD。
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/lottery_system?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=com.example.lotterysystem.dao.handler

# Redis：本机默认端口。
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60s
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=5s

# RabbitMQ：本机默认 guest/guest 账号仅能从本机连接。
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
# 死信队列默认只做持久化停车场，禁止自动回灌主队列，避免毒消息无限循环。
draw.dlx.auto-republish.enabled=false
# Outbox 投递器依赖 Broker Confirm；mandatory + returns 用来识别消息无法路由到通知队列的情况。
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true


# 本地图片目录不再写入老师机器上的 /root 路径。
pic.local-path=${PICTURE_LOCAL_PATH:./target/lottery-pictures}
spring.web.resources.static-locations=classpath:/static/,file:${pic.local-path}

# 本地开发不调用真实短信、邮件服务；通知内容会写入日志。
notification.mock-enabled=true
sms.access-key-id=${SMS_ACCESS_KEY_ID:}
sms.access-key-secret=${SMS_ACCESS_KEY_SECRET:}
sms.sign-name=${SMS_SIGN_NAME:}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.username=${MAIL_USERNAME:mock@local.test}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8

async.executor.thread.core_pool_size=10
async.executor.thread.max_pool_size=20
async.executor.thread.queue_capacity=20
async.executor.thread.name.prefix=async-service-
