# 本地开发默认使用 local 配置；账号密码通过环境变量提供，避免复用教学环境凭据。
spring.profiles.active=local

# Outbox 投递器依赖 Broker Confirm；mandatory + returns 用来识别消息无法路由到通知队列的情况。
# 放在公共配置里，任何 profile 下都生效。
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# 开奖接口等 Broker 确认的最长时间；超时就返回失败，让运营重试
draw.publish-confirm-timeout-ms=3000
