# 双实例部署环境：MySQL、Redis、RabbitMQ、两个应用实例、Nginx 轮询。
# 用法：cp .env.example .env，填好密码后执行 docker compose up -d --build
# 访问：http://localhost:8080（Nginx 轮询转发到 app-a、app-b）
# 为了不和本机已经在跑的服务冲突，容器端口映射到 13306、16379、15673。

x-app: &app
  build: .
  restart: unless-stopped
  environment:
    MYSQL_HOST: mysql
    MYSQL_PORT: 3306
    MYSQL_USERNAME: root
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 里设置 MYSQL_PASSWORD}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
    RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-lottery}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?请在 .env 里设置 RABBITMQ_PASSWORD}
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.0.44
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 里设置 MYSQL_PASSWORD}
      MYSQL_DATABASE: lottery_system
    # 和本地开发库的默认字符集保持一致
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      # 首次启动时按文件名顺序执行：V0 基础表，V1 通知 Outbox
      - ./sql:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      # guest 账号只能从 localhost 登录，容器之间要用单独的账号
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-lottery}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 .env 里设置 RABBITMQ_PASSWORD}
    ports:
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

  app-a:
    <<: *app

  app-b:
    <<: *app

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app-a
      - app-b

volumes:
  mysql-data:
